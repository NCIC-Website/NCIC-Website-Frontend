---
deployment:
  tasks:
    # Set deployment path
    - export DEPLOYPATH=/home/newcreb/public_html
    # Create deployment directory if it doesn't exist
    - mkdir -p $DEPLOYPATH
    # Copy source files (exclude node_modules, .git, and build artifacts)
    - rsync -av --exclude='node_modules' --exclude='.git' --exclude='dist' --exclude='build' --exclude='*.log' . $DEPLOYPATH/
    - cd $DEPLOYPATH
    # Use Node.js 18 (check available versions with: ls /opt/alt/)
    - export PATH=/opt/alt/alt-nodejs18/root/usr/bin:$PATH
    - node --version
    # Install Node.js dependencies
    - npm install
    # Install cross-env for environment variables
    - npm install cross-env --save-dev
    # Try multiple build strategies from least to most resource intensive
    - export NODE_OPTIONS="--max-old-space-size=1536"
    - npm run build:minimal || npm run build:light || npm run build -- --minify=false --sourcemap=false || echo "All builds failed - use local build"
    # Move built files to web root
    - /bin/cp -r dist/* . 2>/dev/null || /bin/cp -r build/* . 2>/dev/null || echo "Build directory not found"
    # Clean up source files and node_modules to save space
    - rm -rf src/ public/ node_modules/ package.json package-lock.json
    # Keep only essential files for production
    - find . -name "*.ts" -o -name "*.tsx" -o -name "*.jsx" | head -10 | xargs rm -f 2>/dev/null || true
